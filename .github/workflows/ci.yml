name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck · build · unit + e2e · demo
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '22.x']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: ${{ matrix.node == '22.x' }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit and end-to-end tests
        run: npx vitest run

      - name: CLI demo smoke test on the built-in fixture app
        run: node dist/bin/agent-eye.js demo --out demo-report

      - name: Package check
        run: npm pack --dry-run

      - name: Upload demo reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-eye-demo-report-${{ matrix.node }}
          path: demo-report
          retention-days: 7

  runtime-node20:
    name: built production package (Node 20.19.0, no test runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20.19.0'
      - run: node scripts/runtime-smoke.mjs
