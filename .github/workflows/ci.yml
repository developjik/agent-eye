name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck · build · unit + e2e · demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit and end-to-end tests
        run: npx vitest run

      - name: CLI demo smoke test on the built-in fixture app
        run: node dist/bin/agent-eye.js demo --out demo-report

      - name: Package check
        run: npm pack --dry-run

      - name: Upload demo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eye-demo-report
          path: demo-report
          retention-days: 7
